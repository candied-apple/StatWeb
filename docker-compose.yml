version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: statweb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: statweb
      POSTGRES_PASSWORD: statweb_pass
      POSTGRES_DB: statweb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
